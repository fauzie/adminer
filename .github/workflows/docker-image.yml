name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main  # Triggers the build when code is pushed to the main branch
    tags:
      - 'v*'   # Triggers when a version tag is pushed (e.g., v1.0.0)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to upload images to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up Docker Buildx (required for advanced caching features)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logs into GitHub Container Registry using the automatic GITHUB_TOKEN
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Automatically extracts metadata (tags, labels) and handles lowercase conversion
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      # Builds the image and pushes it to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
